prePuller:
  hook:
    enabled: false

singleuser:
  # image:
  #   name: user-jupyterlab
  #   tag: latest
  # Defines the default image
  initContainers:
    - name: install-gateway
      image: jupyter/minimal-notebook:latest
      command: ["pip", "install", "jupyter_enterprise_gateway"]

  profileList:
    - display_name: "Minimal environment"
      description: "To avoid too much bells and whistles: Python."
      default: true
    - display_name: "Datascience environment"
      description: "If you want the additional bells and whistles: Python, R, and Julia."
      kubespawner_override:
        image: jupyter/datascience-notebook:2343e33dec46
    - display_name: "Spark environment"
      description: "The Jupyter Stacks spark image!"
      kubespawner_override:
        image: jupyter/all-spark-notebook:2343e33dec46
    - display_name: "Learning Data Science"
      description: "Datascience Environment with Sample Notebooks"
      kubespawner_override:
        image: jupyter/datascience-notebook:2343e33dec46
        lifecycle_hooks:
          postStart:
            exec:
              command:
                - "sh"
                - "-c"
                - >
                  gitpuller https://github.com/data-8/materials-fa17 master materials-fa;
  # Applied to user notebook pods (not the hub pod). After changing this, stop your
  # server from JupyterHub (File → Hub Control Panel → Stop My Server) and start again,
  # or delete the user pod—Helm upgrade alone does not recreate running servers.
  extraEnv:
    JUPYTER_GATEWAY_URL: "http://enterprise-gateway:8888"
    JUPYTER_GATEWAY_CONNECT_TIMEOUT: "120"
    JUPYTER_GATEWAY_REQUEST_TIMEOUT: "120"
  # Default Z2JH user NetworkPolicy blocks egress to private IPs (ClusterIPs). Without
  # this, user pods cannot reach Enterprise Gateway on a ClusterIP service.
  # Tighten in production with a specific egress rule to the gateway pods instead.
  networkPolicy:
    egressAllowRules:
      privateIPs: true